[package]
name = "md-viewer-desktop"
version = "0.1.0"
description = "Human-friendly multi-markdown viewer desktop app"
authors = ["Rintaro-Ko"]
edition = "2021"

[lib]
name = "md_viewer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
